    - uuid: 7db43ff0fe144d86a946afb3a8af5c36
      name: 'Sophos: Uso de CPU (média dos núcleos)'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.25.3.3.1.2]
      key: sophos.cpu.util
      value_type: FLOAT
      units: '%'
      description: Média do hrProcessorLoad (HOST-RESOURCES-MIB) de todos os núcleos. A MIB do Sophos não expõe CPU.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
          var v = value.split('\n').map(function (l) {
              var m = l.match(/=\s*\w+:\s*(-?\d+(\.\d+)?)/);
              return m ? parseFloat(m[1]) : null;
          }).filter(function (x) { return x !== null; });
          if (!v.length) { throw 'Sem dados de hrProcessorLoad'; }
          var s = 0;
          for (var i = 0; i < v.length; i++) { s += v[i]; }
          return s / v.length;
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: 03b738616e58452a934d18e57caeb254
        expression: min(/Sophos SFOS by SNMP/sophos.cpu.util,5m)>{$SOPHOS.CPU.UTIL.CRIT}
        name: 'Sophos: Uso de CPU alto (acima de {$SOPHOS.CPU.UTIL.CRIT}% por 5m)'
        opdata: 'Uso: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        tags:
        - tag: scope
          value: performance

      name: 'Sophos: Capacidade do disco'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2604.5.1.2.4.1.0]
      key: sophos.disk.total
      delay: 1h
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1048576'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: storage
    - uuid: c6fbeb7a4c7440cc99284038447e0e08
      name: 'Sophos: Conexões IPsec configuradas'
      type: DEPENDENT
      key: sophos.ipsec.tunnels.count
      value_type: UNSIGNED
      description: |-
        Quantidade de conexões IPsec que o firewall devolveu no último walk.
        Serve de sentinela da coleta: enquanto este item recebe valor, a leitura da MIB de VPN está viva. Se o SNMP parar, os itens de status de cada túnel congelam no último valor e o painel continua verde — é essa falha silenciosa que a trigger de nodata deste item cobre.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          // Conta quantas conexoes IPsec o firewall devolveu, contando as linhas da
          // coluna sfosIPSecVpnConnName (.2) dentro do walk bruto.
          // O item existe para ter uma sentinela da coleta: se o SNMP parar ou a MIB
          // ficar indisponivel, este item para de receber valor e a trigger de nodata
          // dispara. Nao tem "descartar valor repetido" de proposito.
          var achados = value.match(/1\.3\.6\.1\.4\.1\.2604\.5\.1\.6\.1\.1\.1\.1\.2\./g);

          return achados ? achados.length : 0;
      master_item:
        key: sophos.ipsec.walk
      tags:
      - tag: component
        value: vpn
      triggers:
      - uuid: 1b338cfdf39040898a1a043fd146f260
        expression: nodata(/Sophos SFOS by SNMP/sophos.ipsec.tunnels.count,{$SOPHOS.IPSEC.NODATA})=1
        name: 'Sophos: coleta dos túneis IPsec parada'
        priority: AVERAGE
        description: |-
          Há {$SOPHOS.IPSEC.NODATA} sem leitura da MIB de VPN IPsec.
          Enquanto isso, o status de cada túnel fica parado no último valor coletado e não representa a realidade.
          Verificar: SNMP respondendo no firewall, community/ACL, regra de firewall para a porta 161 e o item mestre sophos.ipsec.walk (estado 'Não suportado').
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: vpn
      - uuid: c2c17db25c9947ff8ddf550dc175b8bb
        expression: last(/Sophos SFOS by SNMP/sophos.ipsec.tunnels.count)=0
        name: 'Sophos: nenhuma conexão IPsec encontrada na MIB'
        priority: WARNING
        description: |-
          O SNMP respondeu, mas não devolveu nenhuma conexão IPsec.
          Costuma ser ACL/visão de MIB restringindo a árvore 1.3.6.1.4.1.2604.5.1.6 ou todas as conexões removidas da configuração.
          Em firewall que realmente não tem IPsec, desative esta trigger no host.
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: vpn

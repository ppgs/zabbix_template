      name: 'WiFi: Clientes conectados'
      type: DEPENDENT
      key: sophos.wifi.clients.total
      value_type: UNSIGNED
      description: Total de clientes associados em todos os pontos de acesso e SSIDs.
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - ssid
        - 1.3.6.1.4.1.2604.5.1.7.2.1.7
        - '0'
      - type: JAVASCRIPT
        parameters:
        - |
          return JSON.parse(value).length;
      master_item:
        key: sophos.wifi.client.walk
      tags:
      - tag: component

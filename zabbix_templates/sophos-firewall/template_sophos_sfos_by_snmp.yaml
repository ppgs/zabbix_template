zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: c89b7991276d43c799fc06693ef19bd2
    template: Sophos SFOS by SNMP
    name: Sophos SFOS by SNMP
    description: |-
      Monitoramento de firewall Sophos SFOS (XG/XGS) por SNMP v2c.

      Versões de referência
        Zabbix ............ 7.4
        SFOS-FIREWALL-MIB . v22 (OID base 1.3.6.1.4.1.2604.5)
        SFOS .............. 18 ou superior; PoE e temperaturas exigem firmware com a MIB v22
        Validated on ..... SFOS 22.0.2 MR-2 (Build 546), modelo XGS138

      Vincula o template oficial "Network Generic Device by SNMP", que traz ICMP, uptime e descoberta de interfaces.

      Os túneis IPsec são descobertos pelo nome real da conexão. O tráfego por túnel também: o Sophos nomeia a interface de túnel como xfrm<N>, onde N é o sfosIPSecVpnConnId, então a descoberta cruza as duas tabelas sozinha, sem de-para manual.

      Autor: Pablo Pires de Godoi Silva
    templates:
    - name: Network Generic Device by SNMP
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 547dd3f2ed6141e68f74a72252c46ad5
      name: 'Sophos HA: Estado deste equipamento'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2604.5.1.4.4.0]
      key: sophos.ha.state
      valuemap:
        name: Sophos HA state
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
      tags:
      - tag: component
        value: ha
    - uuid: 96ea04454e9e42258860ceda421d565c
      name: 'Sophos HA: Estado do par'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2604.5.1.4.5.0]
      key: sophos.ha.peer.state
      valuemap:
        name: Sophos HA state
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
      tags:
      - tag: component
        value: ha
    - uuid: 25d2afc3b5904c8392cc7411b5268384
      name: 'Sophos HA: Status'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2604.5.1.4.1.0]
      key: sophos.ha.status
      delay: 5m
      valuemap:
        name: Sophos HA status
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
      tags:
      - tag: component
        value: ha
    - uuid: cb4270eba5a7455eb8d06414544aec2d
      name: 'Sophos licença Central Orchestration: Data de expiração'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2604.5.1.5.9.2.0]
      key: sophos.license.expiry[central]
      delay: 6h
      value_type: CHAR
      tags:
      - tag: component
        value: license
    - uuid: e028a1e99578470bbd35d02a83a0f1a0
      name: 'Sophos licença Central Orchestration: Dias para expirar'
      type: DEPENDENT
      key: sophos.license.days[central]
      value_type: FLOAT
      units: d
      description: Calculado a partir da data de expiração. -1 = data em formato não reconhecido ou sem licença.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
          var s = String(value).trim();
          var M = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
          var m, d = null;
          if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) {
              d = Date.UTC(+m[1], +m[2] - 1, +m[3]);
          } else if ((m = s.match(/^([A-Za-z]{3})[a-z]*\s+(\d{1,2}),?\s+(\d{4})/)) && M[m[1].toLowerCase()] !== undefined) {
              d = Date.UTC(+m[3], M[m[1].toLowerCase()], +m[2]);
          } else if ((m = s.match(/^(\d{1,2})[\s-]+([A-Za-z]{3})[a-z]*[\s-]+(\d{4})/)) && M[m[2].toLowerCase()] !== undefined) {
              d = Date.UTC(+m[3], M[m[2].toLowerCase()], +m[1]);
          } else if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) {
              d = Date.UTC(+m[3], +m[2] - 1, +m[1]);
          }
          if (d === null) { return -1; }
          return Math.floor((d - Date.now()) / 86400000);
      master_item:
        key: sophos.license.expiry[central]
      tags:
      - tag: component
        value: license
    - uuid: 8d235e077a484b9e9bf3c19bfdd0803e
      name: 'Sophos licença Central Orchestration: Status'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2604.5.1.5.9.1.0]
      key: sophos.license.status[central]
      delay: 6h
      valuemap:
        name: Sophos subscription status
      tags:
      - tag: component
        value: license
      triggers:
      - uuid: 1199554d6cf54546bf458ff2ab401816
        expression: last(/Sophos SFOS by SNMP/sophos.license.status[central])=4 and {$SOPHOS.LICENSE.MONITOR:"central"}=1
        name: 'Sophos: Licença Central Orchestration expirada'
        priority: AVERAGE
        description: Para ignorar esta licença no host, defina {$SOPHOS.LICENSE.MONITOR:"central"}=0.
        tags:
        - tag: scope

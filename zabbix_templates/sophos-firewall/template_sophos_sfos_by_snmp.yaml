      description: Descobre as conexões IPsec configuradas (sfosIPSecVpnTunnelTable).
      item_prototypes:
      - uuid: a44ac2068e29401789077736c569803b
        name: 'VPN {#VPN.NAME}: Ativada'
        type: DEPENDENT
        key: sophos.ipsec.activated[{#SNMPINDEX}]

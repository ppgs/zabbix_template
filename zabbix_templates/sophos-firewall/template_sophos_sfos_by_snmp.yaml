        - tag: vpn
          value: '{#VPN.NAME}'
      - uuid: a92eccfacf294548baa670328ba5132d
        name: 'VPN {#VPN.NAME}: Status da conexão'
        type: DEPENDENT
        key: sophos.ipsec.status[{#SNMPINDEX}]
        valuemap:
          name: Sophos IPsec connection status
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.9.{#SNMPINDEX}
          - '0'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 6h
        master_item:
          key: sophos.ipsec.walk
        tags:
        - tag: component
          value: vpn
        - tag: vpn
          value: '{#VPN.NAME}'
      - uuid: 6321663c3b644d9fa886d44159849be0
        name: 'VPN {#VPN.NAME}: Tipo de conexão'
        type: DEPENDENT
        key: sophos.ipsec.conntype[{#SNMPINDEX}]
        value_type: UNSIGNED
        valuemap:
          name: Sophos IPsec connection type
        description: 'sfosIPSecVpnConnType. Explica por que algumas conexões não têm interface de túnel: só as do tipo tunnel-interface aparecem como xfrm<N> em Rede > Interfaces e, portanto, só elas têm itens de tráfego.'
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.6.{#SNMPINDEX}
          - '0'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 12h
        master_item:
          key: sophos.ipsec.walk
        tags:
        - tag: component
          value: vpn
        - tag: vpn
          value: '{#VPN.NAME}'
      - uuid: eba4ee7d3fc949fcbcd0e7580ee22aa4
        name: 'VPN {#VPN.NAME}: Túneis ativos'
        type: DEPENDENT
        key: sophos.ipsec.activetunnel[{#SNMPINDEX}]
        value_type: UNSIGNED
        description: |-
          sfosIPSecVpnActiveTunnel.

          O significado muda conforme o tipo da conexão:
          - tunnel-interface (site a site baseado em rota): sempre 0. Não use.
          - acesso remoto: número de túneis de cliente ativos, ou seja, quantos usuários estão conectados naquele perfil neste momento.

          Na conexão de acesso remoto o 'Status da conexão' fica inativo mesmo com gente conectada, porque não existe um túnel permanente; é este item que mostra a atividade real.
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.8.{#SNMPINDEX}
          - '0'
        master_item:
          key: sophos.ipsec.walk
        tags:
        - tag: component
          value: vpn
        - tag: vpn
          value: '{#VPN.NAME}'
      trigger_prototypes:
      - uuid: ecf2993fcb334043aea52e58a431c589
        expression: last(/Sophos SFOS by SNMP/sophos.ipsec.status[{#SNMPINDEX}])=0 and last(/Sophos SFOS by SNMP/sophos.ipsec.activated[{#SNMPINDEX}])=1
        name: 'Sophos: Túnel IPsec {#VPN.NAME} inativo'
        priority: HIGH
        description: A conexão está ativada na configuração, mas o túnel está inativo.
        tags:
        - tag: scope
          value: availability
        - tag: vpn
          value: '{#VPN.NAME}'
      - uuid: ae710ac7934142e087142d542b0df8b2
        expression: last(/Sophos SFOS by SNMP/sophos.ipsec.status[{#SNMPINDEX}])=2 and last(/Sophos SFOS by SNMP/sophos.ipsec.activated[{#SNMPINDEX}])=1
        name: 'Sophos: Túnel IPsec {#VPN.NAME} parcialmente ativo'
        priority: WARNING
        description: Apenas parte das SAs do túnel está ativa.
        tags:
        - tag: scope
          value: availability
        - tag: vpn
          value: '{#VPN.NAME}'
      master_item:
        key: sophos.ipsec.walk
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#VPN.NAME}'
        - 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.2
        - '0'

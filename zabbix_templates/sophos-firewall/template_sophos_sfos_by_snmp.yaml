        evaltype: AND
        conditions:
        - macro: '{#VPN.NAME}'
          value: '{$SOPHOS.VPN.NAME.MATCHES}'
        - macro: '{#VPN.NAME}'
          value: '{$SOPHOS.VPN.NAME.NOT_MATCHES}'

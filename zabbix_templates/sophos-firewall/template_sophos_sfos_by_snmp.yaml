    - uuid: 5838b5eb8b024c61a26c260bc5fbff94
      name: 'WiFi: Pontos de acesso desconectados'
      type: DEPENDENT
      key: sophos.wifi.ap.down
      value_type: UNSIGNED
      description: Quantidade de pontos de acesso em disconnected(1). Serve de número único para painel; o alarme por AP vem da trigger da descoberta.
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - status
        - 1.3.6.1.4.1.2604.5.1.7.1.1.5
        - '0'
      - type: JAVASCRIPT
        parameters:
        - |
          // Conta os pontos de acesso desconectados. APStatusType: connected(0),
          // disconnected(1) - a enumeração é invertida em relação ao que se espera.
          var linhas = JSON.parse(value);
          var fora = 0;

          for (var i = 0; i < linhas.length; i++) {
              if (Number(linhas[i]['status']) === 1) {
                  fora++;
              }
          }

          return fora;
      master_item:
        key: sophos.wifi.ap.walk
      tags:
      - tag: component
        value: wifi
    - uuid: 4d71176d371f441aac8c9b3ed4f31533

        value: license
    - uuid: 11aab11d8832479baf0117df18c1c988
      name: 'Sophos licença Web Server Protection: Dias para expirar'
      type: DEPENDENT
      key: sophos.license.days[webserver]
      value_type: FLOAT
      units: d
      description: Calculado a partir da data de expiração. -1 = data em formato não reconhecido ou sem licença.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
          var s = String(value).trim();
          var M = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
          var m, d = null;
          if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) {
              d = Date.UTC(+m[1], +m[2] - 1, +m[3]);
          } else if ((m = s.match(/^([A-Za-z]{3})[a-z]*\s+(\d{1,2}),?\s+(\d{4})/)) && M[m[1].toLowerCase()] !== undefined) {
              d = Date.UTC(+m[3], M[m[1].toLowerCase()], +m[2]);
          } else if ((m = s.match(/^(\d{1,2})[\s-]+([A-Za-z]{3})[a-z]*[\s-]+(\d{4})/)) && M[m[2].toLowerCase()] !== undefined) {
              d = Date.UTC(+m[3], M[m[2].toLowerCase()], +m[1]);
          } else if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) {
              d = Date.UTC(+m[3], +m[2] - 1, +m[1]);
          }
          if (d === null) { return -1; }
          return Math.floor((d - Date.now()) / 86400000);
      master_item:
        key: sophos.license.expiry[webserver]
      tags:
      - tag: component
        value: license

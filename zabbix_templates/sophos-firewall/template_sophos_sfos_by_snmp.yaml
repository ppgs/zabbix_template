        Interface de túnel sem conexão correspondente mantém o nome xfrm<N>.
      item_prototypes:
      - uuid: 55c1c36390884c7a8b839881cb6d8542
        name: 'VPN {#VPN.NAME}: Download'
        type: DEPENDENT
        key: sophos.vpn.net.in[{#SNMPINDEX}]
        value_type: FLOAT
        units: bps
        description: |-
          Download na interface de túnel {#IFNAME} do Sophos.
          O nome da VPN vem do de-para da macro {$SOPHOS.VPN.IFACE.MAP}, porque o SNMP do Sophos devolve só o nome de hardware (xfrm<N>).
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        master_item:
          key: sophos.vpniface.walk
        tags:
        - tag: component
          value: network
        - tag: component
          value: vpn
        - tag: vpn
          value: '{#VPN.NAME}'
      - uuid: d2e10a447f764fd18588f279c62651dd
        name: 'VPN {#VPN.NAME}: Upload'
        type: DEPENDENT
        key: sophos.vpn.net.out[{#SNMPINDEX}]
        value_type: FLOAT
        units: bps
        description: |-
          Upload na interface de túnel {#IFNAME} do Sophos.
          O nome da VPN vem do de-para da macro {$SOPHOS.VPN.IFACE.MAP}, porque o SNMP do Sophos devolve só o nome de hardware (xfrm<N>).
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        master_item:
          key: sophos.vpniface.walk
        tags:
        - tag: component
          value: network
        - tag: component
          value: vpn
        - tag: vpn
          value: '{#VPN.NAME}'
      master_item:
        key: sophos.vpniface.walk
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#IFNAME}'
        - 1.3.6.1.2.1.31.1.1.1.1
        - '0'
        - '{#VPN.NAME}'
        - 1.3.6.1.4.1.2604.5.1.6.1.1.1.1.2
        - '0'
      - type: JAVASCRIPT
        parameters:
        - |
          // Descoberta do tráfego por túnel IPsec, com o nome real da VPN.
          //
          // O Sophos nomeia a interface de túnel como xfrm<N>, onde N é o
          // sfosIPSecVpnConnId da conexão IPsec correspondente. Por isso o nome que
          // aparece em Rede > Interfaces no firewall pode ser obtido sem nenhum de-para
          // manual: basta ler as duas tabelas no mesmo walk e cruzar o número do xfrm
          // com o índice da tabela de túneis.
          //
          // A entrada traz uma linha por índice SNMP. Linhas da tabela de conexões têm
          // {#VPN.NAME}; linhas da IF-MIB têm {#IFNAME}. Os dois índices são
          // independentes, então o cruzamento é feito pelo número dentro do nome xfrm,
          // nunca pelo índice da linha.
          var PADRAO_TUNEL = /^xfrm([0-9]+)$/;

          var linhas = JSON.parse(value);
          var nomes = {};
          var saida = [];
          var i;

          for (i = 0; i < linhas.length; i++) {
              if (linhas[i]['{#VPN.NAME}']) {
                  nomes[linhas[i]['{#SNMPINDEX}']] = linhas[i]['{#VPN.NAME}'];
              }
          }

          for (i = 0; i < linhas.length; i++) {
              var iface = linhas[i]['{#IFNAME}'];

              if (!iface) {
                  continue;
              }

              var achou = PADRAO_TUNEL.exec(iface);

              if (achou === null) {
                  continue;
              }

              saida.push({
                  '{#SNMPINDEX}': linhas[i]['{#SNMPINDEX}'],
                  '{#IFNAME}': iface,
                  '{#VPN.NAME}': nomes[achou[1]] ? nomes[achou[1]] : iface
              });
          }

          return JSON.stringify(saida);
    - uuid: c5f74cdf02f84dc3911f867de48e94a9
      name: Descoberta de túneis IPsec
      type: DEPENDENT
      key: sophos.ipsec.discovery

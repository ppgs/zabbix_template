    - uuid: d245d5f6fd8649368e5ac5e4fea90369
      name: Descoberta de SSID
      type: DEPENDENT
      key: sophos.wifi.ssid.discovery
      description: |-
        Descobre os SSIDs a partir da tabela de clientes, já sem repetição.
        Um SSID só aparece enquanto tiver pelo menos um cliente associado: SSID configurado e vazio não é descoberto.
      item_prototypes:
      - uuid: c136b12b5f2b4af29bd42197ebbde7c1
        name: 'SSID {#WIFI.SSID}: Clientes conectados'
        type: DEPENDENT
        key: sophos.wifi.ssid.clients["{#WIFI.SSID}"]
        value_type: UNSIGNED
        description: Clientes associados a este SSID, somando todos os pontos de acesso.
        preprocessing:
        - type: SNMP_WALK_TO_JSON
          parameters:
          - ssid
          - 1.3.6.1.4.1.2604.5.1.7.2.1.7
          - '0'
        - type: JAVASCRIPT
          parameters:
          - |
            // Clientes conectados neste SSID. Devolve 0 quando o SSID existe mas está
            // vazio, em vez de deixar o item sem dado.
            //
            // O campo do passo anterior se chama 'ssid', e não {#WIFI.SSID}, de propósito:
            // a macro de LLD é substituída em todo o parâmetro, então usar a macro como
            // chave do JSON apagaria a chave e a comparação nunca casaria.
            var alvo = "{#WIFI.SSID}";
            var linhas = JSON.parse(value);
            var total = 0;

            for (var i = 0; i < linhas.length; i++) {
                if (linhas[i]['ssid'] === alvo) {
                    total++;
                }
            }

            return total;
        master_item:
          key: sophos.wifi.client.walk
        tags:
        - tag: component
          value: wifi
        - tag: ssid
          value: '{#WIFI.SSID}'
      master_item:
        key: sophos.wifi.client.walk
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#WIFI.SSID}'
        - 1.3.6.1.4.1.2604.5.1.7.2.1.7
        - '0'
      - type: JAVASCRIPT
        parameters:
        - |
          // A tabela de clientes traz uma linha por cliente, então o mesmo SSID aparece
          // repetido. A descoberta precisa de uma linha por SSID, senão dois clientes na
          // mesma rede geram chave de item duplicada e a LLD falha.
          var linhas = JSON.parse(value);
          var vistos = {};
          var saida = [];

          for (var i = 0; i < linhas.length; i++) {
              var ssid = linhas[i]['{#WIFI.SSID}'];

              if (!ssid || vistos[ssid]) {
                  continue;
              }

              vistos[ssid] = true;
              saida.push({'{#WIFI.SSID}': ssid});
          }

          return JSON.stringify(saida);
